name: Build LaTeX and commit PDF

on:
  push:
    branches: [ main ]
    # Älä laukaise uudelleen PDF‑commiteilla
    paths-ignore: ['**.pdf']

workflow_dispatch: {}

# Explicit permission required so the action can push the generated PDF back
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Compile LaTeX (workshop.tex)
        uses: xu-cheng/latex-action@v2
        with:
          root_file: workshop.tex
          compiler: xelatex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: workshop-pdf
          path: workshop.pdf

      - name: Commit compiled PDF back to repo
        uses: EndBug/add-and-commit@v9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "Build: add compiled workshop.pdf"
          add: "workshop.pdf"
          author_name: github-actions
          author_email: github-actions@github.com

  build_fallback:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install TeX Live (fallback)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-lang-english

      - name: Compile with xelatex (fallback)
        run: |
          set -e
          xelatex -interaction=nonstopmode -halt-on-error workshop.tex || true
          ls -la workshop.pdf || true

      - name: Upload PDF artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: workshop-pdf-fallback
          path: workshop.pdf

      - name: Commit compiled PDF back to repo (fallback)
        uses: EndBug/add-and-commit@v9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "Build(fallback): add compiled workshop.pdf"
          add: "workshop.pdf"
          author_name: github-actions
          author_email: github-actions@github.com