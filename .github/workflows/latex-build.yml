name: Build LaTeX and commit PDF

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Compile LaTeX (workshop.tex)
        uses: xu-cheng/latex-action@v2
        with:
          root_file: workshop.tex
          compiler: xelatex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: workshop-pdf
          path: workshop.pdf

      - name: Commit compiled PDF using PERSONAL_ACCESS_TOKEN (if provided)
        if: env.PERSONAL_ACCESS_TOKEN != ''
        uses: EndBug/add-and-commit@v9
        with:
          github_token: ${{ env.PERSONAL_ACCESS_TOKEN }}
          message: "Build: add compiled workshop.pdf [skip ci]"
          add: "workshop.pdf"
          author_name: github-actions
          author_email: github-actions@github.com

      - name: Commit compiled PDF using GITHUB_TOKEN (best-effort)
        if: env.PERSONAL_ACCESS_TOKEN == ''
        continue-on-error: true
        uses: EndBug/add-and-commit@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message: "Build: add compiled workshop.pdf [skip ci]"
          add: "workshop.pdf"
          author_name: github-actions
          author_email: github-actions@github.com

      - name: Notify if PDF not pushed automatically
        if: env.PERSONAL_ACCESS_TOKEN == ''
        run: |
          echo "Compiled PDF is available as an artifact (see Actions run)."
          echo "To auto-commit the PDF either:"
          echo "  • enable 'Read and write' workflow permissions in repository Settings → Actions → General, or"
          echo "  • add a secret named PERSONAL_ACCESS_TOKEN (personal access token with 'repo' scope)."

  build_fallback:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    env:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install TeX Live (fallback)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-lang-english

      - name: Compile with xelatex (fallback)
        run: |
          set -e
          xelatex -interaction=nonstopmode -halt-on-error workshop.tex || true
          ls -la workshop.pdf || true

      - name: Upload PDF artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: workshop-pdf-fallback
          path: workshop.pdf

      - name: Commit compiled PDF using PERSONAL_ACCESS_TOKEN (fallback)
        if: env.PERSONAL_ACCESS_TOKEN != ''
        uses: EndBug/add-and-commit@v9
        with:
          github_token: ${{ env.PERSONAL_ACCESS_TOKEN }}
          message: "Build(fallback): add compiled workshop.pdf [skip ci]"
          add: "workshop.pdf"
          author_name: github-actions
          author_email: github-actions@github.com

      - name: Commit compiled PDF using GITHUB_TOKEN (fallback, best-effort)
        if: env.PERSONAL_ACCESS_TOKEN == ''
        continue-on-error: true
        uses: EndBug/add-and-commit@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message: "Build(fallback): add compiled workshop.pdf [skip ci]"
          add: "workshop.pdf"
          author_name: github-actions
          author_email: github-actions@github.com

      - name: Notify if PDF not pushed automatically (fallback)
        if: env.PERSONAL_ACCESS_TOKEN == ''
        run: |
          echo "Compiled PDF (fallback) is available as an artifact (see Actions run)."
          echo "To auto-commit the PDF either:"
          echo "  • enable 'Read and write' workflow permissions in repository Settings → Actions → General, or"
          echo "  • add a secret named PERSONAL_ACCESS_TOKEN (personal access token with 'repo' scope)."